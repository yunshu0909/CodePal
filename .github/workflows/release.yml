name: Build & Release

on:
  push:
    tags: ['v*']
    # 日常开发在 dev：推到 dev 也跑测试（build / release 仍只在 v* tag 上跑）
    branches: [dev]
  # PR 门禁（branch-per-task + PR）：合并进主干 / dev 前必须测试绿
  pull_request:
    branches: [master, main, dev]

permissions:
  contents: write

jobs:
  # 测试门禁：PR 与 tag 都跑；红则不合并 / 不构建不发布
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # build/release 只在 tag push 时跑（PR 只跑上面的 test）
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: macos-arm64
            build_command: npm run dist:mac
            asset_paths: |
              release/*.dmg
              release/*.dmg.blockmap
              release/latest-mac.yml
          - os: windows-latest
            artifact_name: windows-x64
            build_command: npm run dist:win
            asset_paths: |
              release/*.exe
              release/*.blockmap
              release/latest*.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Remove dangling symlinks
        shell: bash
        run: |
          rm -f .provider-manifests.json
          rm -f .provider-manifests.json.bak.*

      - name: Build app package
        run: ${{ matrix.build_command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_paths }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
